# AIMET Quantization Training Configuration for NAFNet
# Activation: 8-bit, Weight: 8-bit (A8W8 - Standard INT8)
# Full INT8 quantization for maximum hardware compatibility and efficiency

name: NAFNet_AIMET_a8w8_QAT
model_type: ImageRestorationModel
scale: 1
num_gpu: auto
manual_seed: 10

# 数据集配置
datasets:
  train:
    name: TrainSet
    type: PairedImageDataset
    dataroot_gt: datasets/SIDD/train/gt  # 修改为实际路径
    dataroot_lq: datasets/SIDD/train/noisy
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_flip: true
    use_rot: true

    # 数据加载
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 6  # A8W8 使用稍小的 batch size 以提高稳定性
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: PairedImageDataset
    dataroot_gt: datasets/SIDD/val/gt
    dataroot_lq: datasets/SIDD/val/noisy
    io_backend:
      type: disk

# 网络结构
network_g:
  type: NAFNet
  img_channel: 3
  width: 32
  middle_blk_num: 1
  enc_blk_nums: [1, 1, 1, 28]
  dec_blk_nums: [1, 1, 1, 1]

# 训练设置
train:
  optim_g:
    type: AdamW
    lr: !!float 5e-5  # A8W8 使用更小学习率，因为激活和权重都是 8-bit
    weight_decay: !!float 1e-4
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 300000  # A8W8 需要更长训练时间以充分适应量化
    eta_min: !!float 1e-7

  total_iter: 300000  # 显著增加训练迭代次数
  warmup_iter: 3000   # 更长的 warmup 以稳定训练

  # 损失函数
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1.0
    reduction: mean

# 验证设置
val:
  val_freq: !!float 5e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# 日志设置
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# 分布式训练
dist_params:
  backend: nccl
  port: 29500

# 路径配置
path:
  pretrain_network_g: experiments/pretrained_models/NAFNet-SIDD-width32.pth  # 预训练 FP32 模型
  strict_load_g: true
  resume_state: ~
  root: ./
  experiments_root: experiments/NAFNet_AIMET_a8w8_QAT
  models: experiments/NAFNet_AIMET_a8w8_QAT/models
  training_states: experiments/NAFNet_AIMET_a8w8_QAT/training_states
  log: experiments/NAFNet_AIMET_a8w8_QAT/log
  visualization: experiments/NAFNet_AIMET_a8w8_QAT/visualization

# AIMET A8W8 配置说明
# 这是标准 INT8 量化，适合部署到各种硬件加速器
# 
# 命令行参数：
# --activation_bw 8              # 8-bit activation (标准 INT8)
# --param_bw 8                   # 8-bit weight (per-channel quantization)
# --calibration_batches 200      # 更多校准批次以提高精度
# --quantization_config options/train/quantization/aimet_config_a8w8_perchannel.json
# --aggressive_aug               # 启用激进数据增强（推荐）
# --weight_aug                   # 启用权重增强（推荐）
# --quant_aware_aug              # 启用量化感知增强（推荐）
#
# 关键特性：
# 1. 完全 INT8 量化（激活 + 权重）
# 2. Per-channel 权重量化以保持精度
# 3. 更长的训练时间和 warmup
# 4. 更激进的数据增强策略
# 5. 硬件兼容性最佳（TensorRT, ONNX Runtime INT8）

